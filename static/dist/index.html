    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;--splash-bg:#13151b;--splash-surface-raised:#292d38;--splash-text:#f2f3f7;--splash-muted:#bac0cc;--splash-accent:#c9ee8b}*{box-sizing:border-box}html,body{background:var(--splash-bg);min-height:100vh;color:var(--splash-text);margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.pre-splash-container{place-items:center;min-height:100vh;padding:24px;display:grid}.pre-splash-frame{opacity:0;gap:12px;width:min(320px,100%);animation:.18s cubic-bezier(.16,1,.3,1) .18s forwards pre-splash-reveal;display:grid}.pre-splash-top{justify-content:space-between;align-items:baseline;gap:12px;display:flex}.pre-splash-brand{letter-spacing:-.035em;-webkit-user-select:none;user-select:none;font-size:20px;font-weight:600;line-height:1.2}.pre-splash-brand .accent{color:var(--splash-accent)}.pre-splash-status{color:var(--splash-muted);margin:0;font-size:12px;line-height:1.4}.pre-splash-track{background:var(--splash-surface-raised);border-radius:3px;width:100%;height:3px;overflow:hidden}.pre-splash-bar{background:var(--splash-accent);border-radius:3px;width:42%;height:100%;transition:width .24s cubic-bezier(.16,1,.3,1)}@keyframes pre-splash-reveal{0%{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){.pre-splash-frame{opacity:1;animation:none}.pre-splash-bar{transition:none}}</style>
