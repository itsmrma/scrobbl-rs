<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>scrobbl.rs</title>
    <style>
      :root {
        color-scheme: dark;
        --splash-bg: #13151b;
        --splash-surface-raised: #292d38;
        --splash-text: #f2f3f7;
        --splash-muted: #bac0cc;
        --splash-accent: #c9ee8b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .pre-splash-container {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .pre-splash-frame {
        width: min(320px, 100%);
        display: grid;
        gap: 12px;
        opacity: 0;
        animation: pre-splash-reveal 180ms cubic-bezier(0.16, 1, 0.3, 1) 180ms
          forwards;
      }
      .pre-splash-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .pre-splash-brand {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.2;
        user-select: none;
      }
      .pre-splash-brand .accent {
        color: var(--splash-accent);
      }
      .pre-splash-status {
        font-size: 12px;
        color: var(--splash-muted);
        margin: 0;
        line-height: 1.4;
      }
      .pre-splash-track {
        width: 100%;
        height: 3px;
        border-radius: 3px;
        background: var(--splash-surface-raised);
        overflow: hidden;
      }
      .pre-splash-bar {
        height: 100%;
        width: 42%;
        border-radius: 3px;
        background: var(--splash-accent);
        transition: width 240ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes pre-splash-reveal {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pre-splash-frame {
          animation: none;
          opacity: 1;
        }
        .pre-splash-bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash-container">
        <div class="pre-splash-frame">
          <div class="pre-splash-top">
            <div class="pre-splash-brand">
              scrobbl<span class="accent">.</span>rs
            </div>
            <p class="pre-splash-status">Opening archive…</p>
          </div>
          <div class="pre-splash-track" aria-hidden="true">
            <div class="pre-splash-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
