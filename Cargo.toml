[package]
name = "scrobbl-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "GPL-3.0-or-later"

[features]
# The local inference runtime is part of the official build. Build with
# `--no-default-features` to compile a binary that reports AI as unavailable.
default = ["llama"]
llama = ["dep:llama-cpp-2"]

# Offline parser evaluation. Never built or run by the normal test suite; the
# model is passed by path and nothing is downloaded.
[[bin]]
name = "ask-eval"
path = "src/bin/ask-eval.rs"
required-features = ["llama"]

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
fs2 = "0.4"
futures-util = "0.3.34"
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 0
incremental = true

