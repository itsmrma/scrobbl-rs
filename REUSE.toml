version = 1

[[annotations]]
path = ["src/**", "frontend/**", "tests/**", "scripts/**", "migrations/**", "release-migrations/**", "private-migrations/**", "static/favicon.svg", "README.md", "GLOSSARY.md", "AGENTS.md", "Dockerfile", "compose.yaml", ".dockerignore", ".env.example", ".gitignore", "Cargo.toml", "Cargo.lock", "package.json", "package-lock.json", "vite.config.mts", "playwright.config.cjs", ".github/**", "docs/*.md", "docs/agents/**", "docs/research/**", "docs/reports/**", "docs/screenshots/**"]
SPDX-FileCopyrightText = "2026 itsmrma and scrobbl.rs contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Embedded generated output contains third-party code/assets governed by their
# notices, alongside GPL project code. Its inputs retain their individual licenses.
[[annotations]]
path = ["static/dist/**"]
SPDX-FileCopyrightText = "scrobbl.rs contributors and respective upstream authors; see THIRD_PARTY_NOTICES.md"
SPDX-License-Identifier = "GPL-3.0-or-later AND MIT AND Apache-2.0"

# Upstream texts stored because the published crates omit them; see
# THIRD_PARTY_NOTICES.md. They keep their original licenses.
[[annotations]]
path = ["docs/licenses/upstream/llama-cpp-rs-MIT.txt"]
SPDX-FileCopyrightText = "Dial AI and llama.cpp Rust bindings contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["docs/licenses/upstream/llama-cpp-rs-APACHE-2.0.txt"]
SPDX-FileCopyrightText = "Dial AI and llama.cpp Rust bindings contributors"
