name: Spike 172 runtime builds

# Throwaway verification for issue #172. It builds the harness on the three
# target platforms and measures the Docker image against the distribution
# budget. Model runs stay on the desktop/NAS: the weights are never in CI.
on:
  workflow_dispatch:
  push:
    branches: [spike/172-llama-runtime]
    paths:
      - "spike/172-llama-runtime/**"
      - ".github/workflows/spike-172.yml"

permissions:
  contents: read

concurrency:
  group: spike-172-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_USE_CURL: "1"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  native:
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-amd64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-14, platform: macos-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            spike/172-llama-runtime/target
          key: spike-172-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('spike/172-llama-runtime/Cargo.lock') }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Build release
        working-directory: spike/172-llama-runtime
        run: cargo build --locked --release
      - name: Run unit tests
        working-directory: spike/172-llama-runtime
        run: cargo test --locked --release
      - name: Record binary size
        working-directory: spike/172-llama-runtime
        run: |
          mkdir -p artifacts
          binary=target/release/scrobbl-ask-spike
          test -f "$binary"
          bytes=$(wc -c < "$binary" | tr -d ' ')
          printf '%s %s bytes\n' "${{ matrix.platform }}" "$bytes" | tee artifacts/size.txt
          cp "$binary" artifacts/scrobbl-ask-spike
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spike-172-native-${{ matrix.platform }}
          path: spike/172-llama-runtime/artifacts/
          overwrite: true
          retention-days: 7

  docker:
    name: Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, artifact: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, artifact: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87f5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: spike/172-llama-runtime
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: scrobbl-spike:ci
          cache-from: type=gha,scope=spike-172-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=spike-172-${{ matrix.platform }}
      - name: Measure image and binary against the budget
        working-directory: spike/172-llama-runtime
        run: |
          mkdir -p artifacts
          # Same digest as the Dockerfile runtime stage, so the delta isolates
          # the harness runtime instead of base-image drift.
          docker pull debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
          python3 scripts/measure-size.py \
            --baseline debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8 \
            --spike scrobbl-spike:ci \
            --json-out artifacts/size.json
      - name: Save image for the target machine
        working-directory: spike/172-llama-runtime
        run: docker save scrobbl-spike:ci -o artifacts/scrobbl-spike-${{ matrix.artifact }}.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spike-172-docker-${{ matrix.artifact }}
          path: spike/172-llama-runtime/artifacts/
          overwrite: true
          retention-days: 7
