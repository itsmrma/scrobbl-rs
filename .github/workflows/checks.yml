name: Checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  backend:
    name: Backend (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: Linux }
          - { os: windows-latest, platform: Windows }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - run: mkdir -p ci-logs
      - run: cargo fmt --check 2>&1 | tee ci-logs/fmt.log
      - run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log
      - run: cargo build --locked --all-targets 2>&1 | tee ci-logs/build.log
      - run: cargo test --locked --all-targets -- --nocapture 2>&1 | tee ci-logs/test.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: backend-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ci-logs/
          retention-days: 7

  frontend:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: browser-rust-${{ matrix.browser }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - run: mkdir -p ci-logs
      - run: npm ci 2>&1 | tee ci-logs/install.log
      - run: npm run typecheck 2>&1 | tee ci-logs/typecheck.log
      - run: npm run build 2>&1 | tee ci-logs/build.log
      - name: Check embedded assets match the sources
        run: |
          git diff --exit-code -- static/dist
          test -z "$(git ls-files --others --exclude-standard static/dist)"
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: cargo build --locked --bin scrobbl-rs 2>&1 | tee ci-logs/server-build.log
      - run: npm run test:e2e -- --browser=${{ matrix.browser }} 2>&1 | tee ci-logs/browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            test-results/
            playwright-report/
          retention-days: 7

  docker:
    name: Docker
    uses: ./.github/workflows/docker.yml

  required:
    name: PR checks
    if: always()
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification to have run and succeeded
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          printf 'backend=%s frontend=%s docker=%s\n' "$BACKEND" "$FRONTEND" "$DOCKER"
          test "$BACKEND" = success
          test "$FRONTEND" = success
          test "$DOCKER" = success

  publish:
    name: Publish tested image
    needs: required
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # No repository/PR code runs here. Download only this trusted run's image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tested-image-${{ github.sha }}
      - run: docker load --input tested-image.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed the smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker tag "scrobbl-ci:$GITHUB_SHA" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker tag "scrobbl-ci:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          else
            docker tag "scrobbl-ci:$GITHUB_SHA" "$IMAGE:main"
            docker push "$IMAGE:main"
          fi

  release-sources:
    name: Attach release sources
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scrobbl-distribution-${{ github.sha }}
          path: distribution
      - name: Attach matching sources to a draft version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes 'Release verification pending.'
          fi
          gh release upload "$GITHUB_REF_NAME" distribution/source.tar.gz distribution/source.tar.gz.sha256 --clobber
