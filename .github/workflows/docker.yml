name: Docker verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  image:
    name: linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build linux/amd64 with locked Rust and frontend inputs
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: scrobbl-ci:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check generic Compose, linked SQLite and image persistence
        run: |
          mkdir -p ci-logs
          python3 scripts/verify-docker.py "scrobbl-ci:$GITHUB_SHA" --revision "$GITHUB_SHA" 2>&1 | tee ci-logs/docker.log
      - name: Extract matching source and notices
        run: |
          docker create --name scrobbl-sources "scrobbl-ci:$GITHUB_SHA"
          docker cp scrobbl-sources:/usr/share/scrobbl-rs ./distribution
          docker rm scrobbl-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scrobbl-distribution-${{ github.sha }}
          path: distribution/
          overwrite: true
          retention-days: 7
      - name: Save the tested image for trusted publication
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker save --output tested-image.tar "scrobbl-ci:$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: tested-image-${{ github.sha }}
          path: tested-image.tar
          overwrite: true
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: docker-diagnostics-${{ github.run_attempt }}
          path: ci-logs/
          retention-days: 7
