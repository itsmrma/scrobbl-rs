version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      non-major:
        update-types:
          - minor
          - patch
